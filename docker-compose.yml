version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: game_management_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - game_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: game_management_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - game_network
    volumes:
      - ./logs:/app/logs

  adminer:
    image: adminer
    container_name: game_management_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - game_network

volumes:
  mysql_data:

networks:
  game_network:
    driver: bridge